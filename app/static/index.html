<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Workout Agent</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#334155;
  --text:#f1f5f9;--text-muted:#94a3b8;
  --accent:#6366f1;--accent-hover:#818cf8;
  --user-bg:#6366f1;--bot-bg:#1e293b;
  --radius:16px;--font:'Inter',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden}

/* Header */
.header{
  padding:16px 20px;text-align:center;
  background:var(--surface);border-bottom:1px solid var(--surface2);
  flex-shrink:0;
}
.header h1{font-size:18px;font-weight:600;letter-spacing:-0.02em}

/* Chat area */
.chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:4px}

.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);line-height:1.5;font-size:15px;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user-bg);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot-bg);border-bottom-left-radius:4px;border:1px solid var(--surface2)}
.msg.bot p{margin-bottom:8px}.msg.bot p:last-child{margin-bottom:0}
.msg.bot code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:13px}
.msg.bot pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.msg.bot pre code{background:none;padding:0}
.msg.bot ul,.msg.bot ol{padding-left:20px;margin-bottom:8px}

/* Typing indicator */
.typing{display:none;align-self:flex-start;padding:12px 20px;background:var(--bot-bg);border:1px solid var(--surface2);border-radius:var(--radius);border-bottom-left-radius:4px}
.typing.visible{display:flex;gap:4px;align-items:center}
.typing span{width:8px;height:8px;background:var(--text-muted);border-radius:50%;animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* Input bar */
.input-bar{
  display:flex;gap:8px;padding:12px;
  background:var(--surface);border-top:1px solid var(--surface2);
  flex-shrink:0;
}
.input-bar textarea{
  flex:1;resize:none;border:none;outline:none;
  background:var(--bg);color:var(--text);
  padding:12px 16px;border-radius:24px;
  font-family:var(--font);font-size:15px;
  max-height:120px;line-height:1.4;
}
.input-bar textarea::placeholder{color:var(--text-muted)}
.input-bar button{
  width:44px;height:44px;border:none;border-radius:50%;
  background:var(--accent);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.input-bar button:hover{background:var(--accent-hover)}
.input-bar button:disabled{opacity:.4;cursor:not-allowed}
.input-bar button svg{width:20px;height:20px}

/* Auth overlay */
.auth-overlay{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
}
.auth-overlay.hidden{display:none}
.auth-box{
  text-align:center;padding:32px;max-width:320px;width:100%;
}
.auth-box h2{margin-bottom:8px;font-size:22px;font-weight:600}
.auth-box p{color:var(--text-muted);margin-bottom:24px;font-size:14px}
.auth-box input{
  width:100%;padding:14px 16px;border:1px solid var(--surface2);
  background:var(--surface);color:var(--text);border-radius:12px;
  font-size:16px;font-family:var(--font);margin-bottom:16px;outline:none;
}
.auth-box input:focus{border-color:var(--accent)}
.auth-box .auth-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:500;
  cursor:pointer;font-family:var(--font);
}
.auth-box .auth-btn:hover{background:var(--accent-hover)}
.auth-error{color:#ef4444;font-size:13px;margin-top:8px;display:none}

/* Empty state */
.empty-state{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:15px;text-align:center;padding:40px;
}
.empty-state.hidden{display:none}

/* Safe area for notched phones */
@supports(padding-bottom: env(safe-area-inset-bottom)){
  .input-bar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<!-- Auth screen -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>Workout Agent</h2>
    <p>Enter your passphrase to continue</p>
    <input type="password" id="authInput" placeholder="Passphrase" autocomplete="off">
    <button class="auth-btn" id="authBtn">Continue</button>
    <div class="auth-error" id="authError">Invalid passphrase. Try again.</div>
  </div>
</div>

<!-- Main chat UI -->
<div class="header"><h1>Workout Agent</h1></div>

<div class="chat" id="chat">
  <div class="empty-state" id="emptyState">
    Ask me anything about your workouts, routines, or training.
  </div>
</div>

<div class="typing" id="typing"><span></span><span></span><span></span></div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder="Ask about your workouts…" enterkeyhint="send"></textarea>
  <button id="sendBtn" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<script>
const TOKEN_KEY = 'workout_agent_token';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');
const emptyState = document.getElementById('emptyState');
const authOverlay = document.getElementById('authOverlay');
const authInput = document.getElementById('authInput');
const authBtn = document.getElementById('authBtn');
const authError = document.getElementById('authError');

let token = localStorage.getItem(TOKEN_KEY) || '';
let history = [];
let sending = false;

marked.setOptions({ breaks: true, gfm: true });

// Auth
if (token) authOverlay.classList.add('hidden');

authBtn.addEventListener('click', tryAuth);
authInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });

async function tryAuth() {
  const val = authInput.value.trim();
  if (!val) return;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${val}` },
      body: JSON.stringify({ message: 'hello', history: [] }),
    });
    if (res.status === 401) {
      authError.style.display = 'block';
      return;
    }
    token = val;
    localStorage.setItem(TOKEN_KEY, token);
    authOverlay.classList.add('hidden');
    authError.style.display = 'none';
  } catch {
    authError.textContent = 'Connection error. Try again.';
    authError.style.display = 'block';
  }
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Send
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

async function send() {
  const text = input.value.trim();
  if (!text || sending) return;
  sending = true;
  sendBtn.disabled = true;

  emptyState.classList.add('hidden');
  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';

  typing.classList.add('visible');
  chat.appendChild(typing);
  scrollDown();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });

    const data = await res.json();
    const reply = data.response || 'No response received.';
    typing.classList.remove('visible');
    addMsg(reply, 'bot');
    history.push({ role: 'assistant', content: reply });
  } catch {
    typing.classList.remove('visible');
    addMsg('Network error — please try again.', 'bot');
  }

  sending = false;
  sendBtn.disabled = false;
  input.focus();
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'bot') {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  scrollDown();
}

function scrollDown() {
  requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}
</script>
</body>
</html>
